[project]
name = "kubestats"
version = "0.1.0"
description = "CLI analytics for Kubernetes / OpenShift clusters: CRD adoption, resource limits, GitOps tooling, and Istio service-mesh usage — per namespace."
readme = "README.md"
requires-python = ">=3.14"
license = {text = "MIT"}
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "kubernetes>=29.0.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
]

[project.scripts]
analytics = "kubestats.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kubestats"]

[dependency-groups]
dev = [
    "pyright>=1.1.408",
    "pytest>=9.0.3",
    "ruff>=0.15.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
