[project]
name = "kubestats"
version = "0.1.0"
description = "CLI analytics for Kubernetes / OpenShift clusters: CRD adoption, resource limits, GitOps tooling, and Istio service-mesh usage — per namespace."
readme = "README.md"
requires-python = ">=3.14"
license = {text = "MIT"}
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "kubernetes>=37.0.1",
    "rich>=15.0.0",
    "typer>=0.27.3",
]

[project.scripts]
analytics = "kubestats.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kubestats"]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
